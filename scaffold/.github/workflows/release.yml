# Releasing is delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# The released version is the last git tag; this repository does not carry a
# vendor file that names it. Two entry points share this workflow:
#
# - Pushing a signed `v*` tag from a maintainer machine publishes that tag.
#   Tags pushed with the default GITHUB_TOKEN do not trigger other workflows,
#   so cut the tag from a developer machine (or with a token that does).
# - A `workflow_dispatch` with `tag` set republishes an existing tag, or
#   publishes a tag whose push produced no run.
#
# There is deliberately no `push: branches: [main]` trigger: a merge is not a
# release, and without a version file no file change could identify one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (or republish), e.g. v0.9.0"
        required: true
        type: string

permissions:
  contents: read

# A manual dispatch can race a tag push. Serialise them instead of cancelling,
# so a half-created release is never abandoned.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@{{KIT_VERSION}}
    # `contents: write` uploads the release; `id-token: write` mints the OIDC
    # identity `actions/attest` signs the provenance with; `attestations: write`
    # stores that provenance in the repository's attestation record. Nothing
    # else needs write access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: {{PROVIDER}}
      dist-prefix: terraform-provider-{{PROVIDER}}
      # No version file: the tag is the version. `changelog-check` lives in the
      # tag job, which a tag-driven repository does not run; the changelog is
      # checked by `tfkit release check` against the last tag instead.
      tag: ${{ github.event.inputs.tag }}
