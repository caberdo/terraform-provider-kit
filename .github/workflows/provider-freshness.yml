# Reusable version-matrix freshness check for the caberdo Terraform providers.
#
# Compares the supported-versions file with the newest stable upstream releases
# and opens (or updates) exactly one issue when the matrix lags, closing it again
# when the matrix covers those releases. It never edits the matrix itself: a
# human or an agent lands the bump pull request.
#
# The job exposes `behind` and `newest-missing` as outputs so a canary can test
# the release the matrix does not support yet.
#
# The caller owns the triggers (`schedule` and `workflow_dispatch`) and must
# grant `issues: write`.
name: Provider Version Freshness

on:
  workflow_call:
    inputs:
      provider-display:
        description: "Display casing of the provider (Trino, Gravitino, agentgateway, OpenMetadata, RustFS)"
        required: true
        type: string
      versions-file:
        description: "Path of the supported-versions file, ordered ascending"
        required: true
        type: string
      upstream:
        description: "Upstream repository whose releases define the window (owner/name)"
        required: true
        type: string
      strip-v:
        description: "Strip a leading 'v' from upstream tags before comparing (trino)"
        required: false
        type: boolean
        default: false
      window:
        description: "Number of newest stable releases the matrix must cover"
        required: false
        type: number
        default: 5
      issue-label:
        description: "Label of the freshness issue"
        required: false
        type: string
        default: "version-matrix"

permissions:
  contents: read

jobs:
  # The outputs are the machine-readable half of the report: `behind` is the
  # staleness verdict that opens the issue, `newest-missing` names the release
  # a canary should test. Both are empty/false when nothing is behind.
  upstream:
    name: Check the ${{ inputs.provider-display }} release window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
      newest-missing: ${{ steps.compare.outputs.newest-missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read-only until the comparison finishes: the workflow never edits the
      # matrix. Comments and whitespace are stripped, so a file without them
      # (trino) parses exactly as before. The literal entry `latest` is a
      # rolling marker (rustfs), not a pinned version: it is dropped before the
      # comparison, so it can never look like a release the file does not
      # cover.
      - name: Compare the matrix with the last stable releases
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' ${{ inputs.versions-file }} \
            | grep -v '^$' \
            | grep -vx 'latest' || true)
          if [[ -z "$current" ]]; then
            echo "no pinned ${{ inputs.provider-display }} version found in ${{ inputs.versions-file }}" >&2
            exit 1
          fi
          floor=$(printf '%s\n' "$current" | head -n 1)
          current_max=$(printf '%s\n' "$current" | sort -V | tail -n 1)

          # Newest first from the API; keep published, non-prerelease tags, take
          # `window`. --slurp is required: without it, --paginate emits one JSON
          # array per page and jq would take the window from *each* page.
          releases=$(gh api "repos/${{ inputs.upstream }}/releases?per_page=100" --paginate --slurp)
          window=$(printf '%s' "$releases" \
            | jq -r \
                --argjson window ${{ inputs.window }} \
                --argjson strip ${{ inputs.strip-v && 1 || 0 }} \
                'add | map(select(.draft == false and .prerelease == false)) | .[0:$window] | .[]
                 | [(if $strip == 1 then (.tag_name | sub("^v"; "")) else .tag_name end),
                    (.published_at[0:10])] | @tsv')
          if [[ -z "$window" ]]; then
            echo "the GitHub releases API returned no stable ${{ inputs.provider-display }} releases" >&2
            exit 1
          fi

          window_versions=$(printf '%s\n' "$window" | cut -f1)
          window_max=$(printf '%s\n' "$window_versions" | sort -V | tail -n 1)
          expected=$( { printf '%s\n' "$floor"; printf '%s\n' "$window_versions"; } | sort -V -u)
          detail=$(printf '%s\n' "$window" | awk -F'\t' '{ printf "- %s released %s\n", $1, $2 }')

          # Only a release above every pinned version is a *newer* release a
          # canary can test. A gap below the newest pin still makes the matrix
          # stale (behind), but it is not something to canary, so it is not
          # offered as the newest missing release.
          newest_missing=""
          if [[ "$window_max" != "$current_max" ]] \
            && [[ "$(printf '%s\n%s\n' "$current_max" "$window_max" | sort -V | tail -n 1)" == "$window_max" ]]; then
            newest_missing="$window_max"
          fi

          behind=true
          if diff -u <(printf '%s\n' "$current") <(printf '%s\n' "$expected") >/dev/null; then
            behind=false
            newest_missing=""
          fi

          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "newest-missing=$newest_missing" >> "$GITHUB_OUTPUT"

          # The finding cleared: close the issue that reported it instead of
          # leaving a stale one open. One line of history, then closed.
          if [[ "$behind" == "false" ]]; then
            echo "The matrix already covers the last stable releases."
            existing=$(gh issue list \
              --repo "$REPO" \
              --label ${{ inputs.issue-label }} \
              --state open \
              --search '${{ inputs.provider-display }} version matrix is stale in:title' \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" \
                --repo "$REPO" \
                --body "The ${{ inputs.provider-display }} version matrix covers the last stable releases again, so this issue no longer applies."
              gh issue close "$existing" --repo "$REPO"
              echo "Closed issue #$existing."
            fi
            exit 0
          fi

          echo "The matrix is stale; newest release not covered: ${newest_missing:-none}"
          diff -u <(printf '%s\n' "$current") <(printf '%s\n' "$expected") || true

          body=$(mktemp)
          {
            echo "The acceptance matrix in \`${{ inputs.versions-file }}\` no longer matches the last stable ${{ inputs.provider-display }} releases."
            echo
            echo "**Current**"
            echo '```'
            printf '%s\n' "$current"
            echo '```'
            echo
            echo "**Expected** (floor \`$floor\` plus the last stable releases, ascending)"
            echo '```'
            printf '%s\n' "$expected"
            echo '```'
            echo
            echo "**Releases**"
            printf '%s\n' "$detail"
            echo
            echo "Update the file, run \`make testacc-matrix\`, and land a PR. This workflow never edits the matrix itself."
          } > "$body"

          gh label create ${{ inputs.issue-label }} \
            --description "${{ inputs.provider-display }} version matrix" \
            --color 0e8a16 2>/dev/null || true

          existing=$(gh issue list \
            --repo "$REPO" \
            --label ${{ inputs.issue-label }} \
            --state open \
            --search '${{ inputs.provider-display }} version matrix is stale in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body"
            echo "Updated issue #$existing."
          else
            gh issue create \
              --repo "$REPO" \
              --title "${{ inputs.provider-display }} version matrix is stale" \
              --label ${{ inputs.issue-label }} \
              --body-file "$body"
          fi
