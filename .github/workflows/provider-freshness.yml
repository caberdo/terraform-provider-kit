# Reusable version-matrix freshness check for the caberdo Terraform providers.
#
# Three jobs, each reporting at most one labelled issue that clears itself when
# the finding goes away:
#
#   upstream       compare the versions file with the upstream releases
#   canary         run the acceptance suite against the newest release the
#                  matrix does not cover (opt-in, advisory, never required)
#   kit            compare this repository's kit pin with the newest kit release
#
# It never edits the versions file, the pins, or a tag: a human or an agent
# lands the change. The caller owns the triggers (`schedule` and
# `workflow_dispatch`) and must grant `issues: write`; the canary additionally
# needs `actions: read` to read the failing job's log.
#
# Cadence: one weekly cron for the whole workflow (Monday 06:00 UTC). A caller
# file cannot bind two crons to different jobs, and the maintainer chose weekly
# for the canary. Re-checking the version window weekly costs one API call and
# updates the existing issue in place, so the quieter monthly cadence buys
# nothing while the canary needs to know about a new release within a week.
name: Provider Version Freshness

on:
  workflow_call:
    inputs:
      provider-display:
        description: "Display casing of the provider (Trino, Gravitino, agentgateway, OpenMetadata, RustFS)"
        required: true
        type: string
      versions-file:
        description: "Path of the supported-versions file, ordered ascending"
        required: true
        type: string
      upstream:
        description: "Upstream repository whose releases define the window (owner/name)"
        required: true
        type: string
      strip-v:
        description: "Strip a leading 'v' from upstream tags before comparing (trino)"
        required: false
        type: boolean
        default: false
      strip-suffix:
        description: "Literal suffix removed from the end of a tag after strip-v (openmetadata: -release)"
        required: false
        type: string
        default: ""
      window:
        description: "Number of newest stable releases the matrix must cover"
        required: false
        type: number
        default: 5
      issue-label:
        description: "Label of the freshness issue"
        required: false
        type: string
        default: "version-matrix"
      canary:
        description: "Run the acceptance suite against the newest release the matrix does not cover"
        required: false
        type: boolean
        default: false
      version-env:
        description: "Environment variable the acceptance suite reads the server version from (TRINO_VERSION, ...)"
        required: false
        type: string
        default: ""
      expect-version-env:
        description: "Environment variable in which the suite asserts the version; empty disables the assertion"
        required: false
        type: string
        default: ""
      acceptance-compose:
        description: "Command the canary uses to run the acceptance container"
        required: false
        type: string
        default: "docker compose run --rm test"
      compose-file-args:
        description: "Arguments between `docker compose` and the subcommand, including a trailing space (rustfs)"
        required: false
        type: string
        default: ""
      packages:
        description: "go list pattern the canary's unit profile is produced from (rustfs: ./...)"
        required: false
        type: string
        default: "./internal/..."
      raise-max-map-count:
        description: "Raise vm.max_map_count before the canary (Elasticsearch-backed stacks)"
        required: false
        type: boolean
        default: false
      kit-check:
        description: "Check this repository's kit pin against the newest kit release"
        required: false
        type: boolean
        default: true
      kit-repo:
        description: "Kit repository as owner/name"
        required: false
        type: string
        default: "caberdo/terraform-provider-kit"
      kit-pin-glob:
        description: "Glob of workflow files that pin the kit"
        required: false
        type: string
        default: ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  # The outputs are the machine-readable half of the report: `behind` is the
  # staleness verdict that opens the issue, `newest-missing` names the release
  # a canary should test. Both are empty/false when nothing is behind.
  upstream:
    name: Check the ${{ inputs.provider-display }} release window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
      newest-missing: ${{ steps.compare.outputs.newest-missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read-only until the comparison finishes: the workflow never edits the
      # matrix. Comments and whitespace are stripped, so a file without them
      # (trino) parses exactly as before. The literal entry `latest` is a
      # rolling marker (rustfs), not a pinned version: it is dropped before the
      # comparison, so it can never look like a release the file does not
      # cover.
      - name: Compare the matrix with the last stable releases
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' ${{ inputs.versions-file }} \
            | grep -v '^$' \
            | grep -vx 'latest' || true)
          if [[ -z "$current" ]]; then
            echo "no pinned ${{ inputs.provider-display }} version found in ${{ inputs.versions-file }}" >&2
            exit 1
          fi
          floor=$(printf '%s\n' "$current" | head -n 1)
          current_max=$(printf '%s\n' "$current" | sort -V | tail -n 1)

          # Newest first from the API; keep published, non-prerelease tags, take
          # `window`. --slurp is required: without it, --paginate emits one JSON
          # array per page and jq would take the window from *each* page.
          releases=$(gh api "repos/${{ inputs.upstream }}/releases?per_page=100" --paginate --slurp)
          window=$(printf '%s' "$releases" \
            | jq -r \
                --argjson window ${{ inputs.window }} \
                --argjson strip ${{ inputs.strip-v && 1 || 0 }} \
                --arg suffix "${{ inputs.strip-suffix }}" \
                'add | map(select(.draft == false and .prerelease == false)) | .[0:$window] | .[]
                 | (if $strip == 1 then (.tag_name | sub("^v"; "")) else .tag_name end) as $tag
                 | (if $suffix != "" and ($tag | endswith($suffix))
                    then $tag[0:(($tag | length) - ($suffix | length))]
                    else $tag end) as $normalised
                 | [$normalised, (.published_at[0:10])] | @tsv')
          if [[ -z "$window" ]]; then
            echo "the GitHub releases API returned no stable ${{ inputs.provider-display }} releases" >&2
            exit 1
          fi

          window_versions=$(printf '%s\n' "$window" | cut -f1)
          window_max=$(printf '%s\n' "$window_versions" | sort -V | tail -n 1)
          expected=$( { printf '%s\n' "$floor"; printf '%s\n' "$window_versions"; } | sort -V -u)
          detail=$(printf '%s\n' "$window" | awk -F'\t' '{ printf "- %s released %s\n", $1, $2 }')

          # Only a release above every pinned version is a *newer* release a
          # canary can test. A gap below the newest pin still makes the matrix
          # stale (behind), but it is not something to canary, so it is not
          # offered as the newest missing release.
          newest_missing=""
          if [[ "$window_max" != "$current_max" ]] \
            && [[ "$(printf '%s\n%s\n' "$current_max" "$window_max" | sort -V | tail -n 1)" == "$window_max" ]]; then
            newest_missing="$window_max"
          fi

          behind=true
          if diff -u <(printf '%s\n' "$current") <(printf '%s\n' "$expected") >/dev/null; then
            behind=false
            newest_missing=""
          fi

          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "newest-missing=$newest_missing" >> "$GITHUB_OUTPUT"

          # The finding cleared: close the issue that reported it instead of
          # leaving a stale one open. One line of history, then closed.
          if [[ "$behind" == "false" ]]; then
            echo "The matrix already covers the last stable releases."
            existing=$(gh issue list \
              --repo "$REPO" \
              --label ${{ inputs.issue-label }} \
              --state open \
              --search '${{ inputs.provider-display }} version matrix is stale in:title' \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" \
                --repo "$REPO" \
                --body "The ${{ inputs.provider-display }} version matrix covers the last stable releases again, so this issue no longer applies."
              gh issue close "$existing" --repo "$REPO"
              echo "Closed issue #$existing."
            fi
            exit 0
          fi

          echo "The matrix is stale; newest release not covered: ${newest_missing:-none}"
          diff -u <(printf '%s\n' "$current") <(printf '%s\n' "$expected") || true

          body=$(mktemp)
          {
            echo "The acceptance matrix in \`${{ inputs.versions-file }}\` no longer matches the last stable ${{ inputs.provider-display }} releases."
            echo
            echo "**Current**"
            echo '```'
            printf '%s\n' "$current"
            echo '```'
            echo
            echo "**Expected** (floor \`$floor\` plus the last stable releases, ascending)"
            echo '```'
            printf '%s\n' "$expected"
            echo '```'
            echo
            echo "**Releases**"
            printf '%s\n' "$detail"
            echo
            echo "Update the file, run \`make testacc-matrix\`, and land a PR. This workflow never edits the matrix itself."
          } > "$body"

          gh label create ${{ inputs.issue-label }} \
            --description "${{ inputs.provider-display }} version matrix" \
            --color 0e8a16 2>/dev/null || true

          existing=$(gh issue list \
            --repo "$REPO" \
            --label ${{ inputs.issue-label }} \
            --state open \
            --search '${{ inputs.provider-display }} version matrix is stale in:title' \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$body"
            echo "Updated issue #$existing."
          else
            gh issue create \
              --repo "$REPO" \
              --title "${{ inputs.provider-display }} version matrix is stale" \
              --label ${{ inputs.issue-label }} \
              --body-file "$body"
          fi

  # The canary answers "would the provider still pass on the release we do not
  # support yet". It is advisory: no job depends on it and it is not a required
  # check. GitHub does not allow `continue-on-error` or `timeout-minutes` on a
  # job that calls a reusable workflow, so the hard bound is the acceptance
  # workflow's own per-leg `acceptance-timeout` (45 minutes) and this job's
  # failure is reported by `canary-report`, which runs on `always()`.
  #
  # A relative `./` path cannot be used here: a reusable workflow resolves it
  # against the *calling* repository, not against this kit. The literal ref must
  # be bumped with TFKIT_VERSION in the release commit.
  canary:
    name: Canary ${{ inputs.provider-display }} ${{ needs.upstream.outputs.newest-missing }}
    needs: upstream
    if: inputs.canary && needs.upstream.outputs.behind == 'true' && needs.upstream.outputs.newest-missing != ''
    permissions:
      contents: read
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.16.0
    with:
      provider: ${{ github.event.repository.name }}
      provider-display: ${{ inputs.provider-display }}
      versions-file: ${{ inputs.versions-file }}
      version-env: ${{ inputs.version-env }}
      expect-version-env: ${{ inputs.expect-version-env }}
      version: ${{ needs.upstream.outputs.newest-missing }}
      acceptance-compose: ${{ inputs.acceptance-compose }}
      compose-file-args: ${{ inputs.compose-file-args }}
      packages: ${{ inputs.packages }}
      raise-max-map-count: ${{ inputs.raise-max-map-count }}
      acceptance-timeout: 45
      # A canary must not gate its own unsupported version: the covered floor is
      # calibrated on the newest supported server.
      gate-cell: none
      fail-on-missing-acceptance-profile: false

  # One issue per category, never one per run: the failure report is edited in
  # place as the evidence changes, and closed when a later run passes. The
  # failing packages come from the failed job's own log, so the conclusion is
  # drawn from evidence rather than from the matrix lag alone.
  canary-report:
    name: Report the ${{ inputs.provider-display }} canary
    needs: [upstream, canary]
    if: always() && needs.canary.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open, update or close the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          DISPLAY: ${{ inputs.provider-display }}
          VERSION: ${{ needs.upstream.outputs.newest-missing }}
          RESULT: ${{ needs.canary.result }}
        run: |
          set -euo pipefail

          run_url="$SERVER/$REPO/actions/runs/$RUN_ID"

          # One open issue per category, found by label, not by title: the title
          # carries the version and therefore changes between runs.
          open_issue() {
            gh issue list \
              --repo "$REPO" \
              --label canary-failure \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          }

          if [[ "$RESULT" == "skipped" || "$RESULT" == "cancelled" ]]; then
            echo "The canary did not run ($RESULT); nothing to report."
            exit 0
          fi

          if [[ "$RESULT" == "success" ]]; then
            existing=$(open_issue)
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" \
                --repo "$REPO" \
                --body "The $DISPLAY canary passes on \`$VERSION\`: the bump looks mechanical (a matrix-only edit), so this issue is closing."
              gh issue close "$existing" --repo "$REPO"
              echo "Closed issue #$existing."
            fi
            exit 0
          fi

          # Failure: pull the failed jobs' logs. A log that is not available yet
          # is a warning, not a reason to stay silent: the issue is still the
          # report, it just carries less evidence.
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate --slurp)
          failed_jobs=$(printf '%s' "$jobs" | jq -r '.[].jobs[] | select(.conclusion == "failure") | .id')

          log=$(mktemp)
          while IFS= read -r job; do
            if [[ -z "$job" ]]; then
              continue
            fi
            if ! gh api "repos/$REPO/actions/jobs/$job/logs" >> "$log"; then
              echo "warning: the log for job $job is not available yet" >&2
            fi
          done <<< "$failed_jobs"

          failed_tests=$(grep -oE -- '--- FAIL: [A-Za-z0-9_/]+' "$log" | sed 's/^--- FAIL: //' | sort -u | head -n 20 || true)
          failed_packages=$(awk '{ for (i = 1; i < NF; i++) if ($i == "FAIL") print $(i + 1) }' "$log" | sort -u | head -n 20)

          # The conclusion is only stated when the log supports it. A version
          # assertion that fails may be the canary's own probe (the image tag is
          # wrong) or a provider test; that is not enough to call the bump
          # either way, so it is reported as an open question instead.
          if grep -qF -- '[build failed]' "$log"; then
            conclusion="**code change needed** — the provider does not build against \`$VERSION\`; the build failure is in the run log."
          elif [[ -n "$failed_tests" ]]; then
            if [[ -z "$(printf '%s\n' "$failed_tests" | grep -vi 'version' || true)" ]]; then
              conclusion="**No conclusion yet** — every failing test is a version assertion. Check the image tag and the expected version first: a matrix-only bump and a code change are both possible."
            else
              conclusion="**code change needed** — acceptance tests fail on behaviour, not on the version itself."
            fi
          elif [[ -n "$failed_packages" ]]; then
            conclusion="**No conclusion yet** — the log names failing packages but no failing test; read the run log before deciding."
          else
            conclusion="**No conclusion yet** — the log names no failing Go test or package, so the failure is in the stack, the image or the environment. The bump may still be mechanical."
          fi

          body=$(mktemp)
          {
            echo "<!-- kit canary report -->"
            echo "The \`$DISPLAY\` canary failed on \`$VERSION\`, a release the matrix does not cover yet."
            echo
            echo "**Run:** $run_url"
            echo
            echo "**Failing packages**"
            if [[ -n "$failed_packages" ]]; then
              while IFS= read -r package; do
                echo "- \`$package\`"
              done <<< "$failed_packages"
            else
              echo "The log did not name a failing Go package."
            fi
            echo
            echo "**Failing tests**"
            if [[ -n "$failed_tests" ]]; then
              while IFS= read -r test; do
                echo "- \`$test\`"
              done <<< "$failed_tests"
            else
              echo "The log did not name a failing test."
            fi
            echo
            echo "**Conclusion**"
            echo "$conclusion"
            echo
            echo "This workflow never edits the matrix; the bump stays a decision."
          } > "$body"

          gh label create canary-failure \
            --description "$DISPLAY canary failure" \
            --color b60205 2>/dev/null || true

          existing=$(open_issue)
          title="$DISPLAY canary fails on $VERSION"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --title "$title" --body-file "$body"
            echo "Updated issue #$existing."
          else
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --label canary-failure \
              --body-file "$body"
          fi

  # Compares every pin of the kit in this repository with the kit's newest
  # release. A pin that is behind, a repository that mixes tags, and a pin that
  # names no tag are all failures; the cadence (the caller's weekly cron)
  # belongs to the caller's schedule, not to this job.
  kit:
    name: Check the ${{ inputs.provider-display }} kit pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.kit-check
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the kit pins with the newest kit release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIT_REPO: ${{ inputs.kit-repo }}
          PIN_GLOB: ${{ inputs.kit-pin-glob }}
          DISPLAY: ${{ inputs.provider-display }}
        run: |
          set -euo pipefail

          latest=$(gh api "repos/$KIT_REPO/releases/latest" | jq -r '.tag_name // empty')
          if [[ -z "$latest" ]]; then
            echo "the $KIT_REPO releases API returned no latest tag" >&2
            exit 1
          fi
          # One request instead of one per pin, and unambiguous: a *tag* named
          # like a branch is still a tag only if it is in this list.
          known_tags=$(gh api "repos/$KIT_REPO/tags?per_page=100" --paginate --slurp | jq -r '.[][] | .name')

          # Every `uses:` of a kit workflow, and the GNUmakefile's TFKIT ?=.
          # The owner/repo is escaped so a different kit-repo input still works.
          pins=()
          sources=()
          pattern="${KIT_REPO//./\\.}/\\.github/workflows/[A-Za-z0-9._-]+@[A-Za-z0-9._/-]+"
          while IFS= read -r file; do
            if [[ -z "$file" ]]; then
              continue
            fi
            while IFS= read -r pin; do
              if [[ -z "$pin" ]]; then
                continue
              fi
              pins+=("$pin")
              sources+=("$file")
            done < <(grep -oE -- "$pattern" "$file" | sed 's/.*@//' || true)
          done < <(compgen -G "$PIN_GLOB" || true)

          if [[ -f GNUmakefile ]]; then
            while IFS= read -r pin; do
              if [[ -z "$pin" ]]; then
                continue
              fi
              pins+=("$pin")
              sources+=("GNUmakefile")
            done < <(sed -n 's/^[[:space:]]*TFKIT[[:space:]]*?=[[:space:]].*tfkit@\([^[:space:]]*\).*/\1/p' GNUmakefile)
          fi

          if [[ ${#pins[@]} -eq 0 ]]; then
            echo "no $KIT_REPO pin found under '$PIN_GLOB' or in GNUmakefile's TFKIT ?=; the check cannot report" >&2
            exit 1
          fi

          problems=()
          distinct=$(printf '%s\n' "${pins[@]}" | sort -u | wc -l | tr -d ' ')
          if [[ "$distinct" -gt 1 ]]; then
            problems+=("- the repository pins $distinct different kit tags; every pin must equal \`$latest\`.")
          fi

          pin_rows=""
          while IFS= read -r pin; do
            if [[ -z "$pin" ]]; then
              continue
            fi
            where=""
            for i in "${!pins[@]}"; do
              if [[ "${pins[$i]}" == "$pin" ]]; then
                if [[ -n "$where" ]]; then
                  where="$where, "
                fi
                where="$where\`${sources[$i]}\`"
              fi
            done
            pin_rows="$pin_rows- \`$pin\` in $where"$'\n'
            if [[ "$pin" == "$latest" ]]; then
              continue
            fi
            if ! grep -qxF -- "$pin" <<< "$known_tags"; then
              problems+=("- \`$pin\` in $where is not a tag in \`$KIT_REPO\`.")
            elif [[ "$(printf '%s\n%s\n' "$pin" "$latest" | sort -V | tail -n 1)" == "$latest" ]]; then
              problems+=("- \`$pin\` in $where is behind \`$latest\`.")
            else
              problems+=("- \`$pin\` in $where is ahead of \`$latest\`; the newest release is \`$latest\`.")
            fi
          done <<< "$(printf '%s\n' "${pins[@]}" | sort -u)"

          if [[ ${#problems[@]} -eq 0 ]]; then
            echo "Every kit pin is $latest."
            existing=$(gh issue list \
              --repo "$REPO" \
              --label kit-update \
              --state open \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "Every kit pin is \`$latest\` again; closing this issue."
              gh issue close "$existing" --repo "$REPO"
              echo "Closed issue #$existing."
            fi
            exit 0
          fi

          echo "The kit pins are out of date:"
          printf '%s\n' "${problems[@]}"

          body=$(mktemp)
          {
            echo "<!-- kit pin report -->"
            echo "The newest release of \`$KIT_REPO\` is \`$latest\`, and this repository pins:"
            echo
            printf '%s' "$pin_rows"
            echo
            echo "**Problems**"
            printf '%s\n' "${problems[@]}"
            echo
            echo "Bump every pin to \`$latest\` in one commit; this workflow never edits them."
          } > "$body"

          gh label create kit-update \
            --description "Repository is behind on the kit" \
            --color fbca04 2>/dev/null || true

          existing=$(gh issue list \
            --repo "$REPO" \
            --label kit-update \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          title="$DISPLAY kit pin is out of date"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --title "$title" --body-file "$body"
            echo "Updated issue #$existing."
          else
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --label kit-update \
              --body-file "$body"
          fi

          exit 1
