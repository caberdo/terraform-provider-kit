# Reusable branch-protection drift check for the caberdo Terraform providers.
#
# The caller owns the triggers (`schedule` and `workflow_dispatch`) and must
# grant `issues: write`; reading a repository ruleset needs administration
# permission, which the default GITHUB_TOKEN does not have. Set the
# `BRANCH_PROTECTION_TOKEN` secret to a fine-grained token with
# "Administration: read" on the repository (or a classic token with `repo`).
# Without it the check no-ops with a warning instead of failing forever.
#
# `tfkit branch-protection check` exit codes: 0 match, 1 drift, 2 configuration
# or usage (for example a workflow that cannot be parsed), 3 ruleset
# unreadable. Statuses 0, 1 and 3 have a branch below; 2, an empty status and any
# future status fail the job, because a three-way branch would silently treat 2
# as success and leave the ruleset unverified.
#
# `--soft` is deliberately not passed: it turns an unreadable ruleset into exit
# 0, which is indistinguishable from a match and would let this workflow close a
# drift issue it never verified. The `soft` input below decides instead whether
# exit 3 fails, so the status stays visible to every branch.
# `env.TFKIT_VERSION` names the release of this workflow: when tagging vX, set
# it to vX in the same commit. A reusable workflow ships inside its own tag, so
# it can install the CLI it carries; an older pin would hand every caller of vX
# the older behaviour.
#
name: Provider Protection

on:
  workflow_call:
    inputs:
      ruleset-name:
        description: "Name of the repository ruleset to audit"
        required: false
        type: string
        default: "main-protection"
      soft:
        description: "Treat an unreadable ruleset (exit 3) as a warning instead of a failure"
        required: false
        type: boolean
        default: true
      issue-label:
        description: "Label of the drift issue"
        required: false
        type: string
        default: "ci"
      required-contexts:
        description: "Comma-separated required status check contexts (empty uses the tfkit default)"
        required: false
        type: string
        default: ""
    secrets:
      BRANCH_PROTECTION_TOKEN:
        description: "Token with administration read, so the rulesets API is readable"
        required: false

permissions:
  contents: read

env:
  # `go run` rewrites a child's non-zero status to 1, which would turn tfkit's
  # exit 2 (configuration) and 3 (unreadable ruleset) into the drift status 1.
  # Install once and call the binary so the status reaches the branches below.
  # GOTOOLCHAIN=auto lets a caller with an older Go still build the kit.
  TFKIT_VERSION: v0.14.0
  TFKIT: tfkit
  GOTOOLCHAIN: auto

jobs:
  drift:
    name: Check ${{ inputs.ruleset-name }} ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RULESET_NAME: ${{ inputs.ruleset-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # This job only needs a Go binary to install tfkit; it never builds
          # the provider, so it must not depend on the caller's go.mod or go.sum.
          go-version: stable
          cache: false

      - name: Install tfkit
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/caberdo/terraform-provider-kit/cmd/tfkit@${{ env.TFKIT_VERSION }}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check branch protection
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          REQUIRED_CONTEXTS_INPUT: ${{ inputs.required-contexts }}
        run: |
          set +e
          contexts=()
          if [ -n "$REQUIRED_CONTEXTS_INPUT" ]; then
            contexts=(--contexts "$REQUIRED_CONTEXTS_INPUT")
          fi
          ${{ env.TFKIT }} branch-protection check --repo "$GITHUB_REPOSITORY" "${contexts[@]}" > drift.txt 2>&1
          code=$?
          set -e
          cat drift.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Explain an unreadable ruleset
        if: steps.check.outputs.code == '3'
        run: |
          {
            echo "## Branch protection not checked"
            echo ""
            echo "The rulesets API was not readable. Set the \`BRANCH_PROTECTION_TOKEN\`"
            echo "secret to a token with administration read permission to enable this check."
          } >> "$GITHUB_STEP_SUMMARY"
          cat drift.txt >> "$GITHUB_STEP_SUMMARY"

      - name: All clear
        if: steps.check.outputs.code == '0'
        run: |
          echo "Branch protection matches the policy." >> "$GITHUB_STEP_SUMMARY"
          number="$(gh issue list --label ${{ inputs.issue-label }} --state open --search '"Branch protection drift detected" in:title' \
            --json number,title --jq '.[] | select(.title == "Branch protection drift detected") | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Branch protection is back in sync."
          fi

      - name: Open or update the drift issue
        if: steps.check.outputs.code == '1'
        env:
          REQUIRED_CONTEXTS_INPUT: ${{ inputs.required-contexts }}
        run: |
          # Suggest the same --contexts the check ran with, so a local run
          # reproduces the CI verdict instead of the pre-migration default.
          contexts=""
          if [ -n "$REQUIRED_CONTEXTS_INPUT" ]; then
            contexts=" --contexts \"$REQUIRED_CONTEXTS_INPUT\""
          fi
          title="Branch protection drift detected"
          body="$(mktemp)"
          {
            echo "The \`${{ inputs.ruleset-name }}\` ruleset no longer matches the policy"
            echo "\`tfkit branch-protection check\` enforces."
            echo ""
            echo "Run \`tfkit branch-protection check --ruleset ${{ inputs.ruleset-name }}${contexts}\` locally,"
            echo "fix the drift with \`tfkit branch-protection setup --ruleset ${{ inputs.ruleset-name }}${contexts}\`,"
            echo "and close this issue."
            echo ""
            echo '```'
            cat drift.txt
            echo '```'
          } > "$body"

          gh label create ${{ inputs.issue-label }} --force --color 0e8a16 --description "CI and repository automation" >/dev/null 2>&1 || true

          number="$(gh issue list --label ${{ inputs.issue-label }} --state open --search '"Branch protection drift detected" in:title' \
            --json number,title --jq '.[] | select(.title == "Branch protection drift detected") | .number' | head -n 1)"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --label ${{ inputs.issue-label }} --body-file "$body"
          fi

      # Exit 2 means the check could not run at all (a malformed workflow, a bad
      # flag) and an unhandled status means the CLI contract changed. Neither is
      # a match, so neither may pass: a bare three-way branch would report 2 as
      # success and leave the ruleset unverified. Exit 3 fails only when the
      # caller did not ask for the documented soft behaviour.
      - name: Fail on an unclassified check status
        if: always() && steps.check.outputs.code != '0' && steps.check.outputs.code != '1' && !(steps.check.outputs.code == '3' && inputs.soft)
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          echo "branch-protection check exited with status '${CODE:-<none>}', which is not 0 or 1." >&2
          echo "Status 2 means the check could not run (configuration or usage); see the step output above." >&2
          exit 1
